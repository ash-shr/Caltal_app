# fly.toml app configuration file generated for caltal on 2026-09-17T18:44:43+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'caltal'
primary_region = 'lhr'

[build]

# Settings that aren't secret. Secrets (JWT_SECRET, DB_PASSWORD,
# RESEND_API_KEY...) are set with `fly secrets set` and never written here.
[env]
  # The website's address, used in emailed links. caltal.fly.dev still works,
  # but caltal.app is the one people see.
  APP_URL = 'https://caltal.app'
  # The "Web application" OAuth client from Google Cloud. Google sign-in
  # tokens from the website and the phone app are checked against it. Public
  # by design, like the IDs in frontend/src/config.js and mobile/src/config.js,
  # which must stay the same as this one.
  GOOGLE_CLIENT_ID = '840617417263-275r24qrj30ieclkaer6nr9hk5c3ju9a.apps.googleusercontent.com'

[http_service]
  internal_port = 8080
  force_https = true
  # When nobody is using it, the server is paused rather than switched off.
  # Waking from a pause takes well under a second; starting from off meant
  # Java and Spring Boot booting from scratch, so the first request after a
  # quiet spell (a sign-in, say) took many seconds. Paused costs the same as
  # off: storage only.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
