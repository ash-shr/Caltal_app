spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/caltal}
spring.datasource.username=${DB_USER:caltal}
spring.datasource.password=${DB_PASSWORD:caltal}
# Fly pauses the server when it's idle (fly.toml). After a long pause, database
# connections kept from before may be dead; each is checked before use, and
# this keeps that check short so a dead one is replaced quickly.
spring.datasource.hikari.validation-timeout=2000

# Uploads are only voice notes, which VoiceNoteService caps at 2 MB with a clear
# message. This is the hard stop above that, so nothing bigger is even read.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# No fallback on purpose. A default here would be public on GitHub, and the app
# would quietly run with it if JWT_SECRET were ever missing. Better to refuse
# to start.
jwt.secret=${JWT_SECRET}
jwt.expiry-hours=24

# Fly terminates HTTPS at its proxy and forwards over plain HTTP. Without this,
# Spring sees http:// and treats same-origin browser requests as cross-origin.
server.forward-headers-strategy=framework

# Google Sign-In. The client ID is public by design (it's embedded in every page
# that shows the Google button), so it doesn't need to be a secret. Left empty,
# Google sign-in answers 503 rather than failing to start.
google.client-id=${GOOGLE_CLIENT_ID:}

# The website's address. Emailed links (password resets, email confirmations)
# point here. Taken from settings, never from the incoming request, so nobody
# can get a reset link pointing at their own site.
app.url=${APP_URL:http://localhost:5173}

# Email goes out through Resend (resend.com). The API key is a secret: it lives
# in Fly's secrets, never here. Left empty, emails are only printed to the log,
# and only when app.url is localhost.
mail.resend-api-key=${RESEND_API_KEY:}
# Resend's shared test address can only send to the Resend account's own email.
# Once a domain is verified with Resend, set MAIL_FROM to an address on it.
mail.from=${MAIL_FROM:Caltal <onboarding@resend.dev>}

# Error reports go to Sentry (sentry.io, stored in the EU) when SENTRY_DSN is
# set, as a Fly secret. Left empty (on a laptop, in tests) nothing is sent.
# No personal details: no IP address, no signed-in user, no request bodies.
# Logged warnings (an email that couldn't be sent, say) and errors become
# reports; info lines are kept only as context for them.
sentry.dsn=${SENTRY_DSN:}
sentry.environment=production
sentry.send-default-pii=false
sentry.logging.minimum-event-level=warn
sentry.logging.minimum-breadcrumb-level=info
