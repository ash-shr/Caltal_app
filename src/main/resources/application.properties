spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/caltal}
spring.datasource.username=${DB_USER:caltal}
spring.datasource.password=${DB_PASSWORD:caltal}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

jwt.secret=${JWT_SECRET:change-me-to-a-long-random-string-at-least-32-chars}
jwt.expiry-hours=24