plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.caltalgoogle'
version = '1.0.0'

android {
  namespace "expo.modules.caltalgoogle"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Android's Credential Manager, with Google's sign-in on top of it. This is
  // what replaces the old Google Sign-In library, which Google has deprecated.
  implementation "androidx.credentials:credentials:1.5.0"
  implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
  implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
}
